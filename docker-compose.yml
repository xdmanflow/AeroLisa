# AeroLisa local stack. Services are added release by release.
services:
  postgres:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  # v0.1: airflow (webserver + scheduler), dashboard
  # v0.3: api, mlflow

volumes:
  pgdata:
