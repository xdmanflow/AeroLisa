[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerolisa"
version = "0.0.1"
description = "Skywise-inspired aviation data platform built on public data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manil DOUDOU" }]
keywords = ["aviation", "predictive-maintenance", "data-platform", "ontology", "machine-learning"]
dependencies = []

[project.optional-dependencies]
# Install only what you are working on, e.g. pip install -e ".[core,dev]"
core = ["pydantic>=2", "sqlalchemy>=2", "psycopg[binary]>=3", "alembic"]
data = ["pandas>=2", "pyarrow"]
ml = ["scikit-learn", "xgboost", "mlflow", "matplotlib"]
dl = ["torch"]
fleet = ["traffic", "pyspark"]
api = ["fastapi", "uvicorn[standard]"]
dashboard = ["streamlit", "plotly"]
copilot = ["langchain", "chromadb"]
dev = ["pytest>=8", "ruff", "pre-commit"]

# Uncomment when the CLI (mini-project #0) is ready:
# [project.scripts]
# aerolisa = "aerolisa.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
